<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7faf6">
    <title>Bi-Airspace Twin</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <header class="app-header">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1>Bi-Airspace Twin</h1>
    </header>

    <main class="workspace">
        <aside class="controls" aria-label="Airspace controls">
            <section class="control-section" aria-labelledby="uasHeading">
                <h2 id="uasHeading">UAS Connections</h2>
                <label class="field">ROS Bridge
                    <input id="rosBridgeHost" type="text" value="localhost:9090" spellcheck="false">
                </label>
                <label class="check"><input id="simulationMode" type="checkbox"> Simulation mode</label>
                <form id="uasForm">
                    <div class="fleet-field">
                        <label class="field" for="uasCount">UAS Count
                            <input id="uasCount" type="number" min="1" max="30" step="1" value="1" required aria-describedby="uasRange uasError">
                        </label>
                        <output id="uasRange" for="uasCount" aria-live="polite">cf231</output>
                    </div>
                    <button type="submit" hidden>Apply UAS count</button>
                    <p id="uasError" class="status" role="status"></p>
                </form>
                <details class="fleet-details">
                    <summary>UAS list</summary>
                    <ul id="uasList" class="fleet-list"></ul>
                </details>
            </section>

            <section class="control-section" aria-labelledby="gridHeading">
                <h2 id="gridHeading">Grid-based Airspace</h2>
                <form id="gridForm">
                    <div class="field-grid">
                        <label class="field">Rows<input id="rows" name="rows" type="number" min="1" max="20" step="1" required></label>
                        <label class="field">Cols<input id="cols" name="cols" type="number" min="1" max="20" step="1" required></label>
                        <label class="field">Step X (m)<input id="stepX" name="stepX" type="number" min="0.1" max="2" step="any" required></label>
                        <label class="field">Step Y (m)<input id="stepY" name="stepY" type="number" min="0.1" max="2" step="any" required></label>
                        <label class="field">Layers<input id="layers" name="layers" type="number" min="1" max="10" step="1" required></label>
                        <label class="field">Layer Height (m)<input id="layerHeight" name="layerHeight" type="number" min="0.1" max="5" step="any" required></label>
                    </div>
                    <div class="field-grid origin-grid">
                        <label class="field">Origin X (m)<input id="originX" name="originX" type="number" step="any" required></label>
                        <label class="field">Origin Y (m)<input id="originY" name="originY" type="number" step="any" required></label>
                        <label class="field">Origin Z (m)<input id="originZ" name="originZ" type="number" step="any" required></label>
                    </div>
                    <button id="fetchServiceAPI" class="button button-primary" type="submit">Generate 3D grid</button>
                    <p id="gridStatus" class="status" role="status"></p>
                </form>
            </section>

            <details class="service-section">
                <summary><h2>Occupancy Map</h2></summary>
                <form id="occupancyForm">
                    <label class="field">JSON file<input id="occupancyFile" type="file" accept=".json,application/json" required></label>
                    <label class="field">Layer Height (m)<input id="occLayerHeight" type="number" value="0.35" min="0.05" step="any"></label>
                    <label class="check"><input id="showOccupied" type="checkbox" checked> Show occupied</label>
                    <button id="loadOccupancyMap" class="button" type="submit">Load &amp; render</button>
                    <p id="occStatus" class="status" role="status"></p>
                </form>
            </details>

            <details class="service-section">
                <summary><h2>CDO Service</h2></summary>
                <form id="cdoForm">
                    <label class="field">Host:port<input id="cdoHost" type="text" value="127.0.0.1:2036" required spellcheck="false"></label>
                    <label class="field">Repository path<input id="cdoRepo" type="text" value="/repo1/system" required spellcheck="false"></label>
                    <label class="check"><input id="coordAsLinks" type="checkbox"> Coordinates as links</label>
                    <button id="connectCDO" class="button" type="submit">Connect to CDO</button>
                    <p id="cdoStatus" class="status" role="status"></p>
                </form>
            </details>
        </aside>

        <section class="airspace" aria-labelledby="airspaceHeading">
            <div class="airspace-header">
                <h2 id="airspaceHeading">Airspace</h2>
                <p id="airspaceSource">Local preview</p>
            </div>
            <div id="viewport" aria-label="Interactive 3D airspace"></div>
            <footer class="airspace-footer">
                <ul class="legend" aria-label="Grid cell colors">
                    <li><span class="swatch free"></span>Free</li>
                    <li><span class="swatch obstacle"></span>Obstacle</li>
                    <li><span class="swatch single"></span>Single UAS</li>
                    <li><span class="swatch shared"></span>Shared cell</li>
                </ul>
                <p class="navigation-hint">Click to look around · WASD to move · Q/E to rise or descend · Esc to exit</p>
            </footer>
        </section>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
